<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Budget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0e0d1a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#0e0d1a;overflow:hidden}
/* the page itself can never scroll or shift, so taps always land where they look */
body{position:fixed;inset:0}
iframe{position:fixed;top:0;left:0;width:100%;height:100%;border:0;background:#0e0d1a;transform-origin:0 0}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#a855f7;font:700 64px -apple-system,system-ui,sans-serif}
</style>
</head>
<body>
<div id="load">B</div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzxJehm0y_Q0f6StX9HQGLg6dWVYkElLBzoEvhO_oU4XZvKuI7I0GY01J8rVJBvQXKqew/exec" allow="clipboard-write" onload="document.getElementById('load').style.display='none'"></iframe>
<script>
/* Portrait only: the app always keeps its portrait size. When the phone is turned sideways, the app is
   turned back the other way so it stays upright on the phone, like an app that doesn't rotate.
   Because its size never changes, the app never has to redraw, so there is no lag and taps keep working. */
(function () {
  var f = document.getElementById('app');
  function angle() {
    if (typeof window.orientation === 'number') return window.orientation;            /* iPhone: 0, 90, -90, 180 */
    var a = screen.orientation && screen.orientation.angle; return a === 270 ? -90 : (a || 0);
  }
  function fit() {
    if (window.scrollY || document.body.scrollTop) { window.scrollTo(0, 0); document.body.scrollTop = 0; }
    var w = window.innerWidth, h = window.innerHeight;
    if (w <= h) { f.style.width = w + 'px'; f.style.height = h + 'px'; f.style.transform = ''; return; }
    var a = angle();
    f.style.width = h + 'px'; f.style.height = w + 'px';                                /* same shape as portrait */
    f.style.transform = a === -90 ? 'translateX(' + w + 'px) rotate(90deg)'             /* turned clockwise */
                                  : 'translateY(' + h + 'px) rotate(-90deg)';           /* turned anticlockwise */
  }
  window.addEventListener('orientationchange', fit);
  window.addEventListener('resize', fit);
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  window.addEventListener('pageshow', fit);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) fit(); });
  fit();
})();
</script>
</body>
</html>
